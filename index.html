  // ===== LOAN CALCULATION =====
function getLoanCalc(loan){

  let loanDate = new Date(loan.date);
  let today = new Date();

  let days =
  Math.floor(
    (today - loanDate)
    /
    (1000*60*60*24)
  );

  if(days < 0) days = 0;

  // ৫% মাসিক লাভ
  let dailyRate =
  (loan.amount * 0.05) / 30;

  let profit =
  dailyRate * days;

  let paidLoan =
  (loan.payments || [])
  .reduce((a,b)=>a + Number(b.amount),0);

  let paidProfit =
  profits
  .filter(p=>String(p.loanId)===String(loan.id))
  .reduce((a,b)=>a + Number(b.amount),0);

  let remaining =
  (loan.amount + profit)
  -
  (paidLoan + paidProfit);

  if(remaining < 0)
    remaining = 0;

  return {

    profit,
    paidLoan,
    paidProfit,
    remaining

  };
}

// == CASH CALCULATION ====//
function getCash(){
  let totalSaving = savings.reduce((a,b)=>a+b.amount,0);
  let totalProfit = profits.reduce((a,b)=>a+b.amount,0);
  let totalExpense = expenses.reduce((a,b)=>a+b.amount,0);
  let totalLoanGiven = loans.reduce((a,b)=>a+b.amount,0);

  let totalLoanRepayment = loans
    .flatMap(l => l.payments || [])
    .reduce((a,b)=>a+b.amount,0);

  return totalSaving + totalProfit + totalLoanRepayment - totalExpense - totalLoanGiven;
}

let scannedMember = null;

// ================= START QR SCAN =================
function startQRScan(){

  let box =
  document.getElementById("qrScanner");

  if(!box){

    alert("Scanner পাওয়া যায়নি");
    return;
  }

  box.innerHTML = "";

  const scanner =
  new Html5Qrcode("qrScanner");

  Html5Qrcode
  .getCameras()

  .then(devices=>{

    if(!devices.length){

      alert("ক্যামেরা পাওয়া যায়নি");
      return;
    }

    scanner.start(

      devices[0].id,

      {
        fps:10,
        qrbox:200
      },

      (decodedText)=>{

        scanner.stop();

        let member =
        members.find(
          m=>String(m.id)===String(decodedText)
        );

        if(!member){

          alert("সদস্য পাওয়া যায়নি");
          return;
        }

        scannedMember = member;

        alert("✅ সদস্য পাওয়া গেছে: " + member.name);

        }
      );

    })
    .catch(err => {
      console.log(err);
      alert("ক্যামেরা চালু হয়নি: Permission বা HTTPS সমস্যা");
    });
}

// ===== Dashboard =====
function animateValue(el, start, end, duration) {
  let startTime = null;

  function update(currentTime) {
    if (!startTime) startTime = currentTime;

    let progress = currentTime - startTime;
    let percent = Math.min(progress / duration, 1);

    let value = Math.floor(start + (end - start) * percent);

    el.innerText = value;

    if (percent < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

function getCash(){
  let totalSaving = savings.reduce((a,b)=>a + (b.amount || 0), 0);
  let totalProfit = profits.reduce((a,b)=>a + (b.amount || 0), 0);
  let totalExpense = expenses.reduce((a,b)=>a + (b.amount || 0), 0);
  let totalLoanGiven = loans.reduce((a,b)=>a + (b.amount || 0), 0);

  let totalLoanRepayment = loans
    .flatMap(l => l.payments || [])
    .reduce((a,b)=>a + (b.amount || 0), 0);

  return totalSaving + totalProfit + totalLoanRepayment - totalExpense - totalLoanGiven;
}

// ===== Image Compress (Safe) =====
function compressImage(file, callback){
  let reader = new FileReader();

  reader.onload = function(e){
    let img = new Image();
    img.src = e.target.result;

    img.onload = function(){
      let canvas = document.createElement("canvas");
      let ctx = canvas.getContext("2d");

      let maxWidth = 100;
      let scale = maxWidth / img.width;

      canvas.width = maxWidth;
      canvas.height = img.height * scale;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      let compressed = canvas.toDataURL("image/jpeg", 0.6);
      callback(compressed);
    }
  };

  reader.readAsDataURL(file);
}

function addSaving(){
if(!isAdmin()){
    alert("শুধুমাত্র Admin সদস্য যোগ করতে পারবে");
    return;
  }
  let input = document.getElementById("sname").value.trim();
  let amount = Number(document.getElementById("samount").value);
  let date = document.getElementById("sdate").value;

  if(!input || !amount || !date){ 
    alert("নাম/ID, টাকা এবং তারিখ দিতে হবে"); 
    return; 
  }

  let member = members.find(m => 
    m.id == input || 
    m.name.toLowerCase() == input.toLowerCase()
  );

  if(!member){ 
    alert("সদস্য পাওয়া যায়নি"); 
    return; 
  }

  let month = new Date(date).getMonth();
  let year = new Date(date).getFullYear();

  let already = savings.find(s =>
    s.memberId == member.id &&
    new Date(s.date).getMonth() == month &&
    new Date(s.date).getFullYear() == year &&
    s.amount > 0
  );

  if(already){
    alert("এই মাসের সঞ্চয় ইতিমধ্যে দেওয়া হয়েছে");
    return;
  }

  savings.push({
    memberId: member.id,
    name: member.name,
    amount: amount,
    date: date
  });

  save();
  renderSavings();
  renderDashboard();

  alert("সঞ্চয় সফলভাবে জমা হয়েছে");

  document.getElementById("sname").value="";
  document.getElementById("samount").value="";
  document.getElementById("sdate").value="";
}

// ===== Withdraw by ID =====
function withdrawById(){
if(!isAdmin()){
    alert("শুধুমাত্র Admin সদস্য যোগ করতে পারবে");
    return;
  }
  if(!checkPassword()) return;

  let id = document.getElementById("wid").value.trim();
  let amount = Number(document.getElementById("wamount").value);

  if(!id || !amount){
    alert("ID এবং টাকা দিন");
    return;
  }

  let member = members.find(m => m.id == id);

  if(!member){
    alert("সদস্য পাওয়া যায়নি");
    return;
  }

  let total = savings
    .filter(s => s.memberId == id)
    .reduce((a,b)=>a+b.amount,0);

  if(amount <= 0){
    alert("সঠিক টাকা দিন");
    return;
  }

  if(amount > total){
    alert("পর্যাপ্ত টাকা নেই");
    return;
  }

  savings.push({
    memberId: member.id,
    name: member.name,
    amount: -amount,
    date: new Date().toISOString().split('T')[0]
  });

  save();
  renderSavings();
  renderDashboard();

  alert("উত্তোলন সম্পন্ন");

  document.getElementById("wid").value="";
  document.getElementById("wamount").value="";
}

// ===== Delete Single Member Saving =====
function delSavingMember(memberId){

  if(!isAdmin()){
    alert("❌ শুধুমাত্র Admin ডিলিট করতে পারবে");
    return;
  }

  if(!checkPassword()) return;

  let member = members.find(m => m.id == memberId);

  if(!member){
    alert("সদস্য পাওয়া যায়নি");
    return;
  }

  let ok = confirm(
    `${member.name} এর সব সঞ্চয় ডিলিট করবেন?`
  );

  if(!ok) return;

  // ===== Delete Only This Member Savings =====
  savings = savings.filter(
    s => String(s.memberId) !== String(memberId)
  );

  // ===== Save =====
  localStorage.setItem(
    "savings",
    JSON.stringify(savings)
  );

  // ===== Refresh =====
  renderSavings();
  renderDashboard();

  alert("✅ সদস্যের সব সঞ্চয় ডিলিট হয়েছে");
}
// ===== SMART MEMBER SMS =====
function sendMemberInfoSMS(){

  let meetingDate = prompt("মিটিং এর তারিখ লিখুন");

  if(!meetingDate) return;

  let smsList = [];

  members.forEach(member=>{

    let memberSavings = savings.filter(
      s => s.memberId == member.id
    );

    let totalDeposit = memberSavings
      .filter(s=>s.amount>0)
      .reduce((a,b)=>a+b.amount,0);

    let totalWithdraw = memberSavings
      .filter(s=>s.amount<0)
      .reduce((a,b)=>a+Math.abs(b.amount),0);

    let balance = totalDeposit - totalWithdraw;

    // ===== বাকি হিসাব =====
    let now = new Date();
    let expected = (now.getMonth()+1) * 100;

    let due = expected - totalDeposit;
    if(due < 0) due = 0;

    let msg =
`গাভী পালন,সমবায়,সমিতি,লিঃ
সদস্য: ${member.name}
ID: ${member.id}

মোট সঞ্চয়: ${totalDeposit} টাকা
মোট উত্তোলন: ${totalWithdraw} টাকা
বর্তমান ব্যালেন্স: ${balance} টাকা
বাকি: ${due} টাকা

মিটিং তারিখ:
${meetingDate}

মোবাইল:
${member.mobile}

ধন্যবাদ`;

    smsList.push({
      number: member.mobile,
      text: msg
    });

  });

  // প্রথম সদস্যকে SMS Open
  if(smsList.length > 0){

    let first = smsList[0];

    let smsURL =
`sms:${first.number}?body=${encodeURIComponent(first.text)}`;

    window.location.href = smsURL;

    alert(
"প্রতি সদস্যের SMS আলাদা করে পাঠাতে হবে।"
    );
  }
}

function addLoan(){
if(!isAdmin()){
    alert("শুধুমাত্র Admin সদস্য যোগ করতে পারবে");
    return;
  }
let id = document.getElementById("lid").value.trim();
let name = document.getElementById("lname").value.trim();
let father = document.getElementById("lfather").value.trim();
let addr = document.getElementById("laddr").value.trim();
let mobile = document.getElementById("lmobile").value.trim();
let nid = document.getElementById("lnid").value.trim();
let photo = document.getElementById("loanPhotoPreview").src;
let amount = Number(document.getElementById("lamount").value);
let date = document.getElementById("ldate").value;

if(!id || !name || !father || !amount || !date){
  alert("সব তথ্য দিন");
  return;
}

if(loans.some(l=>l.id==id)){
  alert("এই ID আগে আছে");
  return;
}
// ===== Cash Check =====
let totalSaving = savings.reduce((a,b)=>a+b.amount,0);

let totalProfit = profits.reduce((a,b)=>a+b.amount,0);

let totalExpense = expenses.reduce((a,b)=>a+b.amount,0);

let totalLoanGiven = loans.reduce((a,b)=>a+b.amount,0);

let totalLoanRepayment = loans
  .flatMap(l=>l.payments || [])
  .reduce((a,b)=>a+b.amount,0);

let cash =
  totalSaving +
  totalProfit +
  totalLoanRepayment -
  totalExpense -
  totalLoanGiven;

if(amount > cash){
  alert("❌ দুঃখিত ক্যাশে পর্যাপ্ত টাকা নেই তাই লোন প্রদান করা যাচ্ছে না");
  return;
}
loans.push({
  id,name,father,addr,mobile,nid,photo,amount,date,payments:[]
});

saveLoans();
renderLoan();
renderDashboard();
clearLoanForm();
}

function showLoanProfile(i){

let loan = loans[i];

// ===== MERGE HISTORY =====
let loanPays = (loan.payments || []).map(p => ({
  type: "loan",
  amount: p.amount,
  date: p.date
}));

let profitPays = profits
  .filter(p => p.loanId == loan.id)
  .map(p => ({
    type: "profit",
    amount: p.amount,
    date: p.date
  }));

let all = [...loanPays, ...profitPays];

// ===== SORT BY DATE =====
all.sort((a,b)=> new Date(a.date) - new Date(b.date));

let history = "";

// ===== CALC =====
all.forEach((p,index)=>{

let loanDate = new Date(loan.date);
let payDate = new Date(p.date);

let days = Math.floor((payDate - loanDate)/(1000*60*60*24));
if(days < 0) days = 0;

let dailyRate = (loan.amount * 0.05) / 30;
let profitTillNow = dailyRate * days;

let totalTillNow = loan.amount + profitTillNow;

// 👉 total paid till this date
let paidLoan = all
  .filter(x => new Date(x.date) <= payDate && x.type=="loan")
  .reduce((a,b)=>a+b.amount,0);

let paidProfit = all
  .filter(x => new Date(x.date) <= payDate && x.type=="profit")
  .reduce((a,b)=>a+b.amount,0);

let remaining = totalTillNow - (paidLoan + paidProfit);
if(remaining < 0) remaining = 0;

// ===== label =====
let label = p.type === "loan" ? "লোন পরিশোধ" : "লাভ জমা";

history += `
<tr>
<td>${p.date}</td>
<td>${label}</td>
<td>${p.amount}</td>
<td>${remaining.toFixed(2)}</td>
</tr>`;
});

// ===== CURRENT =====
let c = getLoanCalc(loan);

document.getElementById("loan").innerHTML = `
<h2>লোন প্রোফাইল দেখুন</h2>

<img src="${loan.photo}" style="width:90px;height:90px;border-radius:50%"><br><br>

<b>লোন ID:</b> ${loan.id}<br>
<b>লোন,গ্রহিতার নাম:</b> ${loan.name}<br>
<b>পিতার,নাম:</b> ${loan.father}<br>
<b>মোবাইল:</b> ${loan.mobile}<br>
<b>NID:</b> ${loan.nid}<br>
<b>ঠিকানা:</b> ${loan.addr}<br>
<b>লোন,গ্রহনের তারিখ:</b> ${loan.date}<br><br>

<b>মোট লোন:</b> ${loan.amount} টাকা<br>
<b>এখন,প্রযন্ত মোট লাভ:</b> ${c.profit.toFixed(2)} টাকা<br>
<b>মোট পরিশোধ:</b> ${(c.paidLoan + c.paidProfit).toFixed(2)} টাকা<br>
<b>মোট বাকি:</b> ${c.remaining.toFixed(2)} টাকা<br>

<h3>হিস্ট্রি</h3>

<div class="table-container">
<table border="1">
<tr>
<th>তারিখ</th>
<th>বিবরন</th>
<th>লাভ,জমার পরিমাণ</th>
<th>লোন বাকি</th>
</tr>

${history || "<tr><td colspan='4'>কোন হিস্ট্রি নেই</td></tr>"}

</table>
</div>

<br>
<button onclick="renderLoan()">⬅ Back</button>

`;
}

function renderProfit(){

let months = [
"জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল",
"মে","জুন","জুলাই","আগস্ট",
"সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"
];

let html = `

${isAdmin() ? `

type="number"
placeholder="লাভ জমা">

<input id="pdate"
type="date">

জমা
</button>

` : `

🔒 লাভের তালিকা দেখুন</h4>

`}

<div class="table-container">

<th>ID</th>
<th>ছবি</th>
<th>নাম</th>
<th>লোন</th>

`;

months.forEach(m=>{
  html += `<th>${m}</th>`;
});

html += `

<th>মোট লাভ</th>
<th>জমা</th>
<th>বাকি</th>
<th>স্ট্যাটাস</th>
<th>ডিলিট</th>

</tr>
`;

let today = new Date();

loans.forEach(l=>{

let loanDate = new Date(l.date);

let dailyRate =
(l.amount * 0.05) / 30;

let profitPerMonth =
Array(12).fill(0);

// ===== মাস অনুযায়ী লাভ =====
for(
let m = loanDate.getMonth();
m <= today.getMonth();
m++
){

let monthStart =
new Date(today.getFullYear(), m, 1);

let monthEnd =
new Date(today.getFullYear(), m + 1, 0);

let start =
loanDate > monthStart
? loanDate
: monthStart;

let end =
(m === today.getMonth())
? today
: monthEnd;

let days =
Math.floor(
(end - start) /
(1000*60*60*24)
) + 1;

profitPerMonth[m] =
dailyRate * days;

}

// ===== জমা =====
let payments =
profits.filter(
p => p.loanId == l.id
);

let remaining =
[...profitPerMonth];

payments.forEach(p=>{

let amount =
Number(p.amount);

for(
let m = loanDate.getMonth();
m <= today.getMonth();
m++
){

if(amount <= 0) break;

if(remaining[m] > 0){

let cut =
Math.min(
amount,
remaining[m]
);

remaining[m] -= cut;

amount -= cut;

}

}

});

// ===== মোট হিসাব =====
let totalProfit =
profitPerMonth.reduce(
(a,b)=>a+b,
0
);

let totalPaid =
payments.reduce(
(a,b)=>a+Number(b.amount),
0
);

let totalDue =
remaining.reduce(
(a,b)=>a+b,
0
);

html += `
<tr>

<td>${l.id}</td>

<td>
<img src="${l.photo || 'https://via.placeholder.com/40'}"
width="40">
</td>

<td style="
color:cyan;
font-weight:bold;
cursor:pointer;
">

${l.name}

</td>

<td style="color:#22c55e;font-weight:bold">
${l.amount}
</td>
`;

// ===== মাস =====
months.forEach((_,i)=>{

if(
i < loanDate.getMonth()
||
i > today.getMonth()
){

html += `<td></td>`;

}else{

let paid =
profitPerMonth[i] -
remaining[i];

html += remaining[i] > 0

? `
<td style="
color:red;
font-weight:bold;
">

${remaining[i].toFixed(2)}

</td>
`

: `
<td style="
color:green;
font-weight:bold;
">

✔ ${paid.toFixed(2)}

</td>
`;

}

});

let status =
totalDue === 0
? "✔ PAID"
: "DUE";

html += `

<td style="font-weight:bold">
${totalProfit.toFixed(2)}
</td>

<td style="
color:green;
font-weight:bold;
">

${totalPaid.toFixed(2)}

</td>

<td style="
color:red;
font-weight:bold;
">

${totalDue.toFixed(2)}

</td>

<td style="
color:${totalDue===0?'green':'red'};
font-weight:bold;
">

${status}

</td>

<td>

${isAdmin()

? `
<button
onclick="deleteProfit('${l.id}')"
style="
background:red;
color:white;
">

X

</button>
`

: "🔒"

}

</td>

</tr>
`;

});

html += `
</table>
</div>
`;

document.getElementById("profit").innerHTML = html;

}

// ===== ব্যয় যোগ =====
function addExpense(){

if(!isAdmin()){

alert("❌ শুধুমাত্র Admin ব্যয় যোগ করতে পারবে");

return;

}

let name =
document.getElementById("ename").value.trim();

let amount =
Number(document.getElementById("eamount").value);

let date =
document.getElementById("edate").value;

if(!name || !amount || !date){

alert("সব তথ্য দিন");

return;

}

expenses.push({

name,
amount,
date

});

localStorage.setItem(
"expenses",
JSON.stringify(expenses)
);

renderExpense();

renderDashboard();

alert("✅ ব্যয় যোগ হয়েছে");

document.getElementById("ename").value = "";
document.getElementById("eamount").value = "";
document.getElementById("edate").value = "";

}

// ===== ব্যয় ডিলিট =====
function delExpense(i){

if(!isAdmin()){

alert("❌ শুধুমাত্র Admin ডিলিট করতে পারবে");

return;

}

if(!checkPassword()) return;

let ok = confirm("ব্যয় ডিলিট করবেন?");
if(!ok) return;

expenses.splice(i,1);

localStorage.setItem(
"expenses",
JSON.stringify(expenses)
);

renderExpense();

renderDashboard();

alert("✅ ব্যয় ডিলিট হয়েছে");

}
// ===== মাসিক রিপোর্ট ====
function renderReport(){
  let months=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

  let html="<h3>মাসিক রিপোর্ট দেখুন</h3><div class='table-container'><table border='1'>\
  <tr>\
    <th>মাস</th>\
    <th>সঞ্চয়</th>\
    <th>উত্তোলন</th>\
    <th>লাভ জমা</th>\
    <th>লোন ফেরত</th>\
    <th>ব্যয়</th>\
    <th>নতুন লোন</th>\
    <th>মাস শেষে ক্যাশ</th>\
  </tr>";

  let runningCash=0;

  for(let i=0;i<12;i++){

    let s=savings.filter(x=>new Date(x.date).getMonth()==i).reduce((a,b)=>a+b.amount,0);

    // 🔥 উত্তোলন আলাদা করে
    let withdraw=savings
      .filter(x=>new Date(x.date).getMonth()==i && x.amount<0)
      .reduce((a,b)=>a+Math.abs(b.amount),0);

    let p=profits.filter(x=>new Date(x.date).getMonth()==i)
      .reduce((a,b)=>a+b.amount,0);

    let e=expenses.filter(x=>new Date(x.date).getMonth()==i)
      .reduce((a,b)=>a+b.amount,0);

    let l=loans.filter(x=>new Date(x.date).getMonth()==i)
      .reduce((a,b)=>a+b.amount,0);

    let loanRepayment=loans.flatMap(l=>l.payments||[])
      .filter(pmt=>new Date(pmt.date).getMonth()==i)
      .reduce((a,b)=>a+b.amount,0);

    runningCash += s + p + loanRepayment - e - l;

    html+=`
    <tr>
      <td>${months[i]}</td>
      <td>${s}</td>
      <td style="color:red">${withdraw}</td>
      <td>${p}</td>
      <td>${loanRepayment}</td>
      <td>${e}</td>
      <td>${l}</td>
      <td style="color:blue;font-weight:bold">${runningCash}</td>
    </tr>`;
  }

  html+="</table></div>";

  document.getElementById("report").innerHTML=html;
}

  viewProfile(memberId);
}else{
  show("dashboard");
}
</script>
